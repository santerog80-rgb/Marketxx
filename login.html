
<!DOCTYPE html>
<html lang="pt-MZ">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MozCommerce</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1><i class="fas fa-store"></i> MozCommerce</h1>
                <p>Entre na sua conta para continuar</p>
            </div>

            <div class="auth-tabs">
                <div class="auth-tab active" data-tab="login">
                    <i class="fas fa-sign-in-alt"></i> Login
                </div>
                <div class="auth-tab" data-tab="register">
                    <i class="fas fa-user-plus"></i> Cadastro
                </div>
            </div>

            <!-- Login Form -->
            <form class="auth-form active" id="loginForm">
                <div class="form-group">
                    <label for="loginEmail">Email</label>
                    <input type="email" id="loginEmail" class="form-control" placeholder="seu@email.com" required>
                </div>
                
                <div class="form-group">
                    <label for="loginPassword">Senha</label>
                    <div class="password-input">
                        <input type="password" id="loginPassword" class="form-control" placeholder="Sua senha" required>
                        <button type="button" class="toggle-password">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                
                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="rememberMe">
                        <span>Lembrar-me</span>
                    </label>
                    <a href="#" class="forgot-password">Esqueceu a senha?</a>
                </div>
                
                <button type="submit" class="btn btn-primary btn-block">
                    <i class="fas fa-sign-in-alt"></i> Entrar
                </button>
                
                <div class="social-login">
                    <p>Ou entre com:</p>
                    <div class="social-buttons">
                        <button type="button" class="btn btn-google">
                            <i class="fab fa-google"></i> Google
                        </button>
                        <button type="button" class="btn btn-facebook">
                            <i class="fab fa-facebook-f"></i> Facebook
                        </button>
                    </div>
                </div>
            </form>

            <!-- Register Form -->
            <form class="auth-form" id="registerForm">
                <div class="form-group">
                    <label for="registerName">Nome Completo</label>
                    <input type="text" id="registerName" class="form-control" placeholder="Seu nome completo" required>
                </div>
                
                <div class="form-group">
                    <label for="registerEmail">Email</label>
                    <input type="email" id="registerEmail" class="form-control" placeholder="seu@email.com" required>
                </div>
                
                <div class="form-group">
                    <label for="registerPhone">Telem\u00f3vel</label>
                    <input type="tel" id="registerPhone" class="form-control" placeholder="+258 84 123 4567" required>
                    <p class="form-text">Formato: +258 seguido do n\u00famero (ex: +258 84 123 4567)</p>
                </div>
                
                <div class="form-group">
                    <label for="registerProvince">Prov\u00edncia</label>
                    <select id="registerProvince" class="form-control" required>
                        <option value="">Selecione a prov\u00edncia</option>
                        <option value="Maputo Cidade">Maputo Cidade</option>
                        <option value="Maputo Prov\u00edncia">Maputo Prov\u00edncia</option>
                        <option value="Gaza">Gaza</option>
                        <option value="Inhambane">Inhambane</option>
                        <option value="Sofala">Sofala</option>
                        <option value="Manica">Manica</option>
                        <option value="Tete">Tete</option>
                        <option value="Zamb\u00e9zia">Zamb\u00e9zia</option>
                        <option value="Nampula">Nampula</option>
                        <option value="Niassa">Niassa</option>
                        <option value="Cabo Delgado">Cabo Delgado</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="registerCity">Cidade</label>
                    <input type="text" id="registerCity" class="form-control" placeholder="Sua cidade" required>
                </div>
                
                <div class="form-group">
                    <label for="registerPassword">Senha</label>
                    <input type="password" id="registerPassword" class="form-control" placeholder="M\u00ednimo 6 caracteres" minlength="6" required>
                </div>
                
                <div class="form-group">
                    <label for="registerConfirmPassword">Confirmar Senha</label>
                    <input type="password" id="registerConfirmPassword" class="form-control" placeholder="Confirme sua senha" required>
                </div>
                
                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="registerTerms" required>
                        <span>Concordo com os <a href="#">Termos de Uso</a> e <a href="#">Pol\u00edtica de Privacidade</a></span>
                    </label>
                </div>
                
                <button type="submit" class="btn btn-primary btn-block">
                    <i class="fas fa-user-plus"></i> Criar Conta
                </button>
            </form>

            <div class="auth-footer">
                <a href="index.html" class="back-home">
                    <i class="fas fa-arrow-left"></i> Voltar ao Inicio
                </a>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/currency.js"></script>
    <script>
        // Password visibility toggle
        document.querySelectorAll('.toggle-password').forEach(button => {
            button.addEventListener('click', function() {
                const input = this.previousElementSibling;
                const icon = this.querySelector('i');
                
                if (input.type === 'password') {
                    input.type = 'text';
                    icon.classList.remove('fa-eye');
                    icon.classList.add('fa-eye-slash');
                } else {
                    input.type = 'password';
                    icon.classList.remove('fa-eye-slash');
                    icon.classList.add('fa-eye');
                }
            });
        });

        // Social login buttons (placeholder functionality)
        document.querySelectorAll('.btn-google, .btn-facebook').forEach(button => {
            button.addEventListener('click', function() {
                alert('Funcionalidade de login social em desenvolvimento. Por favor, use email e senha.');
            });
        });
    </script>
</body>
</html>
